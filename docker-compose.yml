services:
  app:
    # Pre-built image from Docker Hub (instant startup, no compilation needed):
    image: sakib-m/connection-check:latest

    # Or uncomment to build from source code locally:
    # build:
    #   context: .
    #   dockerfile: Dockerfile

    container_name: connection_check_app
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - PORT=3000
      - DB_PATH=/app/data/speedtest.db
      - TEMPLATES_DIR=/app/web/templates
      - STATIC_DIR=/app/web/static
    volumes:
      - ./data:/app/data
