services:
  app:
    # Option A: Build from source locally (takes 1-2 minutes on first build)
    build:
      context: .
      dockerfile: Dockerfile

    # Option B: Or use your pre-built image from GitHub Container Registry (instant startup):
    # image: ghcr.io/<your-github-username>/connection-check:latest

    container_name: connection_check_app
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - PORT=3000
      - DB_PATH=/app/data/speedtest.db
      - TEMPLATES_DIR=/app/web/templates
      - STATIC_DIR=/app/web/static
    volumes:
      - ./data:/app/data
